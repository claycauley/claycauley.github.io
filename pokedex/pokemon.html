<section class="pokemonDetails">
    <div class="pokemonIDAndSpecies">
        <div class="pokemonID">
            <p class="paragraphGrid"><span class="icon idBadge"></span><strong class="pokemonNationalID"></strong></p>
        </div>
        <div class="pokemonSpecies">
            <p class="paragraphGrid"><strong class="pokemonSpeciesFull">Seed Pokemon</strong></p>
        </div>
    </div>
    <div class="container">
        <div class="pokemonImage">
            <img src="https://placehold.co/140" alt="Pokemon Detail Background">
        </div>
        <div class="pokemonImageShiny">
            <img src="https://placehold.co/140" alt="Pokemon Detail Background">
        </div>
    </div>
    <div class="pokemonInfo">
            <p class="paragraphGrid">
                <span class="label">
                    <span class="icon location"></span><strong>Region</strong>
                </span>
                <span id="pokemonDetailRegion"></span>
            </p>
            <p class="paragraphGrid">
                <span class="label">
                    <span class="icon height"></span><strong>Height</strong>
                </span>
                <span id="pokemonDetailHeight"></span>
            </p>
            <p class="paragraphGrid">
                <span class="label">
                    <span class="icon weight"></span><strong>Weight</strong>
                </span>
                <span id="pokemonDetailWeight"></span>
            </p>
        </div>
    <div class="pokemonTypings">
            <div class="dualTyping">
                <div class="type1">
                    <p class="paragraphGrid" id="pokemonType1Display">
                        <span></span><strong></strong>
                    </p>
                </div>
                <div class="type2">
                    <p class="paragraphGrid" id="pokemonType2Display">
                        <span></span><strong></strong>
                    </p>
                </div>
            </div>
    </div>
</section>

<section class="pokemonGenderBreakdown additionalPokemonInfo">
    <h2>Gender Breakdown</h2>
</section>

<section class="pokemonBaseStats additionalPokemonInfo">
    <h2>Base Stats</h2>
    <div class="baseStatsContainer">
        <div class="statsLabel">
            <span class="statName">HP</span>
            <span class="statName">Atk</span>
            <span class="statName">Def</span>
            <span class="statName">Sp. Atk</span>
            <span class="statName">Sp. Def</span>
            <span class="statName">Speed</span>
        </div>
        <div class="statsGraph">
            <div class="statBar" id="hpStatBar"></div>
            <div class="statBar" id="atkStatBar"></div>
            <div class="statBar" id="defStatBar"></div>
            <div class="statBar" id="spAtkStatBar"></div>
            <div class="statBar" id="spDefStatBar"></div>
            <div class="statBar" id="speedStatBar"></div>
        </div>
        <div class="statsValue">
            <span class="statValue" id="hpStatValue">10</span>
            <span class="statValue" id="atkStatValue">20</span>
            <span class="statValue" id="defStatValue">30</span>
            <span class="statValue" id="spAtkStatValue">40</span>
            <span class="statValue" id="spDefStatValue">50</span>
            <span class="statValue" id="speedStatValue">60</span>
        </div>
</section>

        <h3>Game Version:</h3>
