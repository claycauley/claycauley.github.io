<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="theme-color" content="#222222">
    <meta name="msapplication-navbutton-color" content="#222222">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="description" content="Browse and filter Pokémon with beautiful animations and offline support">
    <title>Pokédex</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/imgs/icon-192x192.png">
    <link rel="apple-touch-icon" href="assets/imgs/icon-192x192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://jariz.github.io/vibrant.js/dist/Vibrant.js"></script>
    <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
    <!-- Progress bar for background caching -->
    <div id="progressBar" class="progress-bar"></div>
    
    <div class="container">
        <header>
            <h1>🔴 Pokédex</h1>
        </header>

        <div class="search-container">
            <div class="search-input-wrapper">
                <input type="text" id="searchInput" placeholder="Search Pokémon by name or ID...">
                <button id="clearSearchBtn" class="clear-search-btn" title="Clear search"><span class="icon x-mark"></span></button>
            </div>
            <button id="openFiltersBtn" class="icon-btn" title="Open filters"><span class="icon filter"></span></button>
            <button id="openSettingsBtn" class="icon-btn" title="Open settings"><span class="icon settings"></span></button>
        </div>        <div id="errorContainer"></div>
        <div id="pokemonContainer" class="pokemon-grid"></div>
        <div id="loadingContainer" class="loading" style="display: none;">Loading...</div>
    </div>

    <!-- Modal for Pokemon Details -->
    <div id="pokemonModal" class="modal">
        <div class="modal-content">
            <span class="close" id="pokemonModalClose"><span class="icon x-mark"></span></span>
            <div class="modal-header-gradient">
                <div class="modal-header">
                    <img id="modalImage" class="modal-image" src="" alt="Pokemon">
                    <div class="modal-name" id="modalName"></div>
                    <div class="modal-id" id="modalId"></div>
                </div>
            </div>
            <button id="cryButton" style="margin-top: 20px; margin-bottom: 20px; padding: 8px 16px; background-color: #667eea; color: white; border: none; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: bold; transition: all 0.3s ease;">🔊 Cry</button>
            <div id="modalTypes" class="pokemon-types" style="margin-bottom: 20px;"></div>
            <div id="modalStats"></div>
            <div id="modalAbilities" style="margin-top: 20px;"></div>
            <div id="modalEvolutions" style="margin-top: 20px;"></div>
            <div id="modalOtherForms" style="margin-top: 20px;"></div>
            <div id="modalEffectiveness" class="type-effectiveness"></div>
        </div>
    </div>

    <!-- Modal for Filters -->
    <div id="filtersModal" class="modal">
        <div class="modal-content filters-modal-content">
            <span class="close close-filters"><span class="icon x-mark"></span></span>
            <h2>Filter Pokémon</h2>
            
            <div class="filter-group">
                <label>
                    <input type="checkbox" id="favoritesFilter">
                    <span>Show Only Favorites</span>
                </label>
            </div>

            <div class="filter-group">
                <label for="generationFilter">Generation:</label>
                <select id="generationFilter">
                    <option value="">All Generations</option>
                    <option value="1">Gen I</option>
                    <option value="2">Gen II</option>
                    <option value="3">Gen III</option>
                    <option value="4">Gen IV</option>
                    <option value="5">Gen V</option>
                    <option value="6">Gen VI</option>
                    <option value="7">Gen VII</option>
                    <option value="8">Gen VIII</option>
                    <option value="9">Gen IX</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="typeFilter">Type:</label>
                <select id="typeFilter">
                    <option value="">All Types</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="categoryFilter">Category:</label>
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                    <option value="legendary">Legendary</option>
                    <option value="mythical">Mythical</option>
                    <option value="mega">Mega</option>
                    <option value="gmax">Gigantamax</option>
                    <option value="baby">Baby</option>
                </select>
            </div>

            <div class="filter-buttons">
                <button id="resetFiltersBtn">Reset Filters</button>
                <button id="applyFiltersBtn" class="apply-btn">Apply Filters</button>
            </div>
        </div>
    </div>

    <!-- Modal for Settings -->
    <div id="settingsModal" class="modal">
        <div class="modal-content settings-modal-content">
            <span class="close close-settings"><span class="icon x-mark"></span></span>
            <h2>Settings</h2>
            
            <div class="filter-group">
                <label>Form Visibility:</label>
                <div class="toggles-group">
                    <label class="mobile-toggle">
                        <span>Show Mega Evolutions</span>
                        <input type="checkbox" id="showMegaToggle">
                        <div class="toggle-slider"></div>
                    </label>
                    <label class="mobile-toggle">
                        <span>Show Gigantamax Forms</span>
                        <input type="checkbox" id="showGmaxToggle">
                        <div class="toggle-slider"></div>
                    </label>
                    <label class="mobile-toggle">
                        <span>Show Regional Variants</span>
                        <input type="checkbox" id="showRegionalVariantsToggle">
                        <div class="toggle-slider"></div>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js?v=7"></script>
</body>
</html>
