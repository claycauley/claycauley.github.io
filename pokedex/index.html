<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="msapplication-navbutton-color" content="#000000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="description" content="Browse and filter Pokémon with beautiful animations and offline support">
    <title>PoClaydex</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/imgs/icon-192x192.png">
    <link rel="apple-touch-icon" href="assets/imgs/icon-192x192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles/styles.css?v=50">
    <link rel="stylesheet" href="assets/styles/pokemon-details.css?v=50">
    <link rel="stylesheet" href="assets/styles/filters-settings.css?v=50">
</head>
<body>
    <!-- Progress bar for background caching -->
    <div id="progressBar" class="progress-bar"></div>
    
    <div class="container">
        <header>
            <img src="assets/imgs/poclaydex-logo.svg" alt="PoClaydex Logo" width="50%" class="logo">
        </header>

        <div class="search-container">
            <div class="search-input-wrapper">
                <input type="text" id="searchInput" placeholder="Search Pokémon ..." autocomplete="off">
                <button id="clearSearchBtn" class="clear-search-btn" title="Clear search"><span class="icon x-mark"></span></button>
            </div>
            <button id="openFiltersBtn" class="icon-btn" title="Open filters" style="position: relative;">
                <span class="icon filter"></span>
                <div id="filterBadge" class="filter-badge" style="display: none;">
                    <span id="filterCount">0</span>
                </div>
            </button>
            <button id="openSettingsBtn" class="icon-btn" title="Open settings"><span class="icon settings"></span></button>
        </div>        
        
        <div id="errorContainer"></div>
        
        <div id="pokemonContainer" class="pokemon-grid">
            <!-- <div class="pokemonCard" data-template>
                <div class="pokemonImage">
                    <img src="https://placehold.co/140" alt="Pokemon Image">
                </div>
                <div class="pokemonInfo">
                    <p class="pokemonName">Blubasaur</p>
                    <ul class="pokemonTyping">
                        <li class="typeOne"><span class="icon grassType"></span>Grass</li>
                        <li class="typeTwo"><span class="icon poisonType"></span>Poison</li>
                    </ul>
                </div>
                <div class="additionalInfo">
                    <div class="favorite-heart" data-pokemon-id="1">
                        <span class="icon heart-icon not-favorite"></span>
                    </div>
                    <div class="pokemonID">
                        <p class="nationalDexNumber">001</p>
                    </div>
                </div>
            </div> -->
        </div>
    </div>

    <!-- Pokemon Detail Panel (slides up from bottom) -->
    <div id="pokemonDetailBackdrop" class="panel-backdrop"></div>
    <div id="pokemonDetailPanel" class="pokemon-detail-panel">
    
        <div class="detailHeader">
            <button id="detailCloseBtn" class="icon-btn back-btn" title="Go back">
                <span class="icon back-arrow"></span>
            </button>
            <h1 id="pokemonDetailName"></h1>
            <div class="favoriteHeartsContainer">
                <div class="favorite-heart"><span class="icon heart-icon not-favorite"></span></div>
            </div>
        </div>
        <div id="pokemonDetailContent">
            <!-- Content will be loaded from pokemon.html -->
        </div>
    </div>

    <div id="filtersBackdrop" class="panel-backdrop"></div>
    <div id="filtersPanel" class="filters-panel">
        <div class="detailHeader">
            <h1>Filters</h1>
            <button id="filtersPanelCloseBtn" class="icon-btn back-btn" title="Go back">
                <span class="icon x-mark"></span>
            </button>
        </div>
        <div id="filtersPanelContent">
            <div class="filter-group favorites">
                <label>
                    <p class="paragraphGrid"><span class="icon heart"></span>Show Only My Favorites</p>
                    <input type="checkbox" id="favoritesFilter">
                </label>
            </div>

            <hr>

            <div class="filter-group">
                <label class="dropdown" for="generationFilter">Generation</label>
                <select id="generationFilter">
                    <option value="">All Generations</option>
                    <option value="1">Gen I</option>
                    <option value="2">Gen II</option>
                    <option value="3">Gen III</option>
                    <option value="4">Gen IV</option>
                    <option value="5">Gen V</option>
                    <option value="6">Gen VI</option>
                    <option value="7">Gen VII</option>
                    <option value="8">Gen VIII</option>
                    <option value="9">Gen IX</option>
                </select>
            </div>

            <div class="filter-group">
                <label class="dropdown" for="typeFilter">Type</label>
                <select id="typeFilter">
                    <option value="">All Types</option>
                </select>
            </div>

            <div class="filter-group">
                <label class="dropdown" for="categoryFilter">Category</label>
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                    <option value="legendary">Legendary</option>
                    <option value="mythical">Mythical</option>
                    <option value="mega">Mega</option>
                    <option value="gmax">Gigantamax</option>
                    <option value="baby">Baby</option>
                </select>
            </div>

            <hr>

            <div class="filter-buttons">
                <button id="resetFiltersBtn">Reset Filters</button>
                <button id="applyFiltersBtn" class="apply-btn">Apply Filters</button>
                <button id="clearFavoritesBtn" class="clear-favorites-btn hiddenUnlessFavorites" title="Clear all favorites"><span class="icon heart-broken"></span>Clear Favorites</button>
            </div>
        </div>
    </div>

    <!-- Settings Panel (slides up from bottom) -->
    <div id="settingsBackdrop" class="panel-backdrop"></div>
    <div id="settingsPanel" class="settings-panel">
        <div class="detailHeader">
            <h1>Settings</h1>
            <button id="settingsPanelCloseBtn" class="icon-btn back-btn" title="Go back">
                <span class="icon x-mark"></span>
            </button>
        </div>
        <div id="settingsPanelContent">
            <div class="filter-group">
                <label>View Pokédex as:</label>
                <div class="view-toggle-group">
                    <button id="viewToggleList" class="view-toggle-btn active" title="List View">
                        <span class="icon list"></span>
                    </button>
                    <button id="viewToggleGrid" class="view-toggle-btn" title="Grid View">
                        <span class="icon grid"></span>
                    </button>
                </div>
            </div>

            <div class="filter-group">
                <label>Form Visibility:</label>
                <div class="toggles-group">
                    <label class="mobile-toggle">
                        <span>Show Mega Evolutions</span>
                        <input type="checkbox" id="showMegaToggle">
                        <div class="toggle-slider"></div>
                    </label>
                    <label class="mobile-toggle">
                        <span>Show Gigantamax Forms</span>
                        <input type="checkbox" id="showGmaxToggle">
                        <div class="toggle-slider"></div>
                    </label>
                    <label class="mobile-toggle">
                        <span>Show Regional Variants</span>
                        <input type="checkbox" id="showRegionalVariantsToggle">
                        <div class="toggle-slider"></div>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading/Splash Screen -->
    <div id="loadingContainer" class="splash-screen" style="display: none;">
        <img src="assets/imgs/splashscreen.jpg" alt="Loading..." class="splash-image">
        <div class="splash-progress-bar"></div>
    </div>

    <!-- Modal for Pokemon Details -->
    <div id="pokemonModal" class="modal">
        <div class="modal-content">
            <span class="close" id="pokemonModalClose"><span class="icon x-mark"></span></span>
            <div class="modal-header-gradient">
                <div class="modal-header">
                    <img id="modalImage" class="modal-image" src="" alt="Pokemon">
                    <div class="modal-id" id="modalId"></div>
                    <div class="modal-name" id="modalName"></div>
                    <div class="modal-region" id="modalRegion"></div>
                </div>
            </div>
            <div id="modalTypes" class="pokemon-types" style="margin-bottom: 20px;"></div>
            <div id="modalHeightWeight" style="margin-bottom: 20px;"></div>
            <div id="modalGender" style="margin-bottom: 20px;"></div>
            <div id="modalStats"></div>
            <div id="modalAbilities" style="margin-top: 20px;"></div>
            <div id="modalEvolutions" style="margin-top: 20px;"></div>
            <div id="modalOtherForms" style="margin-top: 20px;"></div>
            <div id="modalEffectiveness" class="type-effectiveness"></div>
            <div id="modalMoves" style="margin-top: 20px;"></div>
        </div>
    </div>

    <section id="pokemonFavoritesToast" class="pokemon-favorites-toast">
        <p class="paragraphGrid"><span class="icon heart-check"></span>Added to Favorites!</strong></p>
    </section>

    <section id="pokemonFavoritesToastRemoval" class="pokemon-favorites-toast">
        <p class="paragraphGrid"><span class="icon heart-broken"></span>Removed from Favorites!</strong></p>
    </section>

    <section id="pokemonFavoritesToastCleared" class="pokemon-favorites-toast">
        <p class="paragraphGrid"><span class="icon circle-checkmark"></span>Favorites Cleared!</strong></p>
    </section>

    <script src="script.js?v=50"></script>
</body>
</html>
